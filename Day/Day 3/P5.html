<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tables 2</title>
</head>
<body>
    <!-- Table Caption -->
    <table border="1">
        <caption>Student Listing</caption>
        <thead>
            <tr>
                <th>Sl. No</th>
                <th>Name</th>
            </tr>
        </thead>
        <tbody>
        <tr>
            <td>1</td>
            <td>Sanjay</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Honnur Ali</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
